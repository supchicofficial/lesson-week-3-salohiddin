{% extends "manager/base.html" %}
{% block title %}Delete task{% endblock %}
{% block content %}
<div class="card form-card">
    <h1>Delete task?</h1>
    <p>Are you sure you want to delete <strong>{{ task.title }}</strong>? This cannot be undone.</p>
    <form method="post" class="form-actions">
        {% csrf_token %}
        <a class="button secondary" href="{% url 'task-list' %}">Cancel</a>
        <button class="button delete-button" type="submit">Delete</button>
    </form>
</div>
{% endblock %}
